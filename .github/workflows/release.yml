name: Build and Release BeastMasterHelper BST

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: dotnet build src/BeastMasterHelper/BeastMasterHelper.csproj -c Release --nologo -p:Version=0.10.5.12 -p:AssemblyVersion=0.10.5.12 -p:FileVersion=0.10.5.12 -p:InformationalVersion=0.10.5.12

      - name: Strip PDBs from packaged zip
        shell: bash
        run: python3 -c "
import zipfile, os
zp = 'src/BeastMasterHelper/bin/Release/net10.0-windows/BeastMasterHelperBST/latest.zip'
tmp = zp + '.tmp'
with zipfile.ZipFile(zp, 'r') as zin:
    with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
        for item in zin.infolist():
            if not item.filename.lower().endswith('.pdb'):
                zout.writestr(item, zin.read(item.filename))
os.replace(tmp, zp)
"

      - name: Copy packaged zip to plugins folder
        shell: bash
        run: |
          mkdir -p plugins/BeastMasterHelper
          cp "src/BeastMasterHelper/bin/Release/net10.0-windows/BeastMasterHelperBST/latest.zip" "plugins/BeastMasterHelper/BeastMasterHelper.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BeastMasterHelper-v0.10.5.12
          name: Beast Master Helper (BST) v0.10.5.12
          files: plugins/BeastMasterHelper/BeastMasterHelper.zip
          draft: false
          prerelease: false
          generate_release_notes: false
