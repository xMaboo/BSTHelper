name: Build BeastMasterHelper BST

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read and increment version
        shell: pwsh
        run: |
          $vf = Get-Content "version.txt"
          $parts = $vf -split '.'
          $parts[3] = [int]$parts[3] + 1
          $nv = $parts -join '.'
          Set-Content -Path "version.txt" -Value $nv
          echo "VERSION=$nv" >> $env:GITHUB_ENV

      - name: Build plugin
        shell: pwsh
        run: dotnet build src/BeastMasterHelper/BeastMasterHelper.csproj -c Release --nologo

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt version.props src/BeastMasterHelper/BeastMasterHelper.csproj plugins/BeastMasterHelper/BeastMasterHelper.zip repo.json
          git commit -m "chore: auto-build v$env:VERSION [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed"
